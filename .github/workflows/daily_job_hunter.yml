name: Daily Job Discovery & Application Engine

on:
  schedule:
    # Runs at 03:30 UTC every day (09:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      track:
        description: 'Specific Track to run (leave blank for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'laravel'
          - 'dotnet_angular'
      dry_run:
        description: 'Run in Dry-Run mode (fills form, does not click final submit)'
        required: true
        default: true
        type: boolean
      max_apps:
        description: 'Maximum jobs to process in this run'
        required: true
        default: '5'
        type: string

permissions:
  contents: write  # Allows committing updated applications.db back to repo

jobs:
  job-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Job Discovery & Application Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEADLESS: 'true'
          DATABASE_PATH: 'database/applications.db'
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --live"
          fi
          if [ -n "${{ inputs.track }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --track ${{ inputs.track }}"
          fi
          MAX_APPS="${{ inputs.max_apps || '5' }}"
          
          python main.py --max-apps "$MAX_APPS" $EXTRA_ARGS

      - name: Persist SQLite Database State (Deduplication History)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database/applications.db
          git diff --staged --quiet || (git commit -m "chore(db): update applications database state [skip ci]" && git push)

      - name: Upload Applications Database Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applications-db
          path: database/applications.db
          retention-days: 30
